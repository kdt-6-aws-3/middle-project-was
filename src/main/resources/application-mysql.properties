database=mysql
spring.datasource.url=${MYSQL_URL:jdbc:mysql://endpoint:3306/petclinic}
spring.datasource.username=${MYSQL_USER:petclinic_app}
spring.datasource.password=${MYSQL_PASS:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=10000
spring.sql.init.mode=never
