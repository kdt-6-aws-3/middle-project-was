# database init, supports mysql too
database=mysql
spring.datasource.url=${MYSQL_URL:jdbc:mysql://endpoint:3306/petclinic}
spring.datasource.username=${MYSQL_USER:petclinic_app}
spring.datasource.password=${MYSQL_PASS:}
# schema.sql/data.sql are not re-runnable (plain CREATE TABLE / INSERT): the DB owner runs them
# once. Set SPRING_SQL_INIT_MODE=always only to load an empty database, then remove it again.
spring.sql.init.mode=never
# Also write logs to a file (for the CloudWatch agent); console output still goes to journald.
# Rolled at 10MB, kept 7 days (Spring Boot defaults), and capped at 1GB in total.
logging.file.name=/var/log/petclinic/app.log
logging.logback.rollingpolicy.total-size-cap=1GB
