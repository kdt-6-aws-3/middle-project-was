# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Internationalization (validation messages follow the request's Accept-Language header)
spring.messages.basename=messages/messages
spring.web.locale=en

# Actuator
# Only the health endpoint is exposed; it is used by the internal ALB health check
management.endpoints.web.exposure.include=health

# WEB-WAS integration (Apache mod_proxy_http -> internal ALB -> WAS)
# Idle keep-alive must outlast the ALB idle timeout (60s), otherwise the ALB may reuse a
# connection Tomcat has just closed and answer 502. Order: Apache ttl 50s < ALB 60s < WAS 65s
server.tomcat.keep-alive-timeout=65s
# On scale-in, finish in-flight requests before stopping (keep below the target group
# deregistration delay)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE
